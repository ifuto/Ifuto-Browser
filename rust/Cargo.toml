[workspace]
members = ["akl-core", "akl-ffi", "ifuto-core", "ifuto-ffi"]
resolver = "2"

# cfg(kani) を check-cfg に登録（cargo 1.80+ の unexpected_cfgs 警告対策）
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/ifuto/Ifuto-Browser"

# プロファイル: Kani/Miri はデフォルトで実行される
[profile.dev]
debug = true

[profile.release]
lto = true
codegen-units = 1
